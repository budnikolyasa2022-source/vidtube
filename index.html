<style>
:root{--bg:#0f0f0f;--bg2:#181818;--bg3:#272727;--text:#f1f1f1;--muted:#aaa;--accent:#ff0033;--border:#303030;--radius:12px;--header-h:56px;--bottom-nav-h:56px;--sidebar-w:220px;--card-bg:#181818;--hover:rgba(255,255,255,.06);--overlay:rgba(0,0,0,.75);--hashtag:#6cb6ff;--thumb-bg:linear-gradient(135deg,#2c2c2c,#161616)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;width:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;transition:background .2s,color .2s;width:100%;overflow-x:hidden;position:relative}
button,input,textarea,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.hashtag{color:var(--hashtag);cursor:pointer;font-weight:500}
.hashtag:active{opacity:.7}

header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--border);min-height:var(--header-h);transition:background .2s;width:100%}
.logo{font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 6px;border-radius:10px;flex-shrink:0}
.logo .dot{width:24px;height:16px;background:var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0}
.logo .ver{font-size:9px;color:var(--muted);font-weight:600;background:var(--bg3);padding:2px 5px;border-radius:5px}
.search{flex:1;display:none;max-width:520px}
.search input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:20px 0 0 20px;padding:10px 14px;color:var(--text);outline:none;font-size:14px;min-width:0}
.search button{background:var(--bg3);border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;padding:0 16px;font-size:14px;min-height:40px}
.icon-circle{background:var(--bg2);border:1px solid var(--border);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;position:relative;padding:0}
.top-search-btn{display:flex;margin-left:auto}
.bell-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
#authArea{display:flex;gap:5px;align-items:center;flex-shrink:1;min-width:0}
.user-chip{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:12px;max-width:150px;cursor:pointer;flex-shrink:1;min-width:0}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.mini-avatar img{width:100%;height:100%;object-fit:cover}
.auth-btn{background:transparent;border:1px solid var(--border);padding:7px 10px;border-radius:20px;font-size:12px;white-space:nowrap;min-height:34px;flex-shrink:0}
.auth-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding-bottom:calc(var(--bottom-nav-h) + 16px + env(safe-area-inset-bottom));width:100%;overflow-x:hidden}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);transition:background .2s}
.bottom-nav button{flex:1;background:none;padding:6px 2px 5px;font-size:9px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.bottom-nav button.active{color:var(--text)}
.bottom-nav button.active .ic{color:var(--accent)}
.bottom-nav .ic{font-size:19px;line-height:1}
.bottom-nav .plus{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar{display:none}

.banner{height:110px;background:linear-gradient(120deg,#ff0033,#ff8a00,#7a00ff);background-size:cover;background-position:center;width:100%}
.chan-header{padding:0 14px;margin-top:-38px;width:100%}
.chan-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:700;overflow:hidden}
.chan-avatar img{width:100%;height:100%;object-fit:cover}
.chan-info{margin-top:10px}
.chan-name{font-size:20px;font-weight:700;margin-bottom:5px;word-break:break-word}
.chan-stats{color:var(--muted);font-size:12px;margin-bottom:10px;word-break:break-word}
.chan-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.edit-btn{background:var(--bg3);border:none;padding:9px 14px;border-radius:20px;font-size:12px;font-weight:600;min-height:38px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 14px;margin-top:6px;overflow-x:auto;width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--muted);padding:12px 12px;font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.chan-home{padding:14px;width:100%}
.featured-video{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;cursor:pointer}
.featured-video .thumb{width:100%;aspect-ratio:16/9;max-height:60vh;background:var(--thumb-bg);position:relative;overflow:hidden}
.featured-video .thumb img{width:100%;height:100%;object-fit:cover}
.featured-label{display:inline-block;background:rgba(255,0,51,.15);color:var(--accent);font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}
.featured-video .info{padding:12px}
.featured-video .info h3{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.35}
.featured-video .info .meta{font-size:12px;color:var(--muted)}
.chan-home-section-title{font-size:14px;font-weight:700;margin:16px 0 10px;color:var(--text)}

.grid{display:flex;flex-direction:column;gap:14px;padding:10px 12px}
.card{cursor:pointer;padding:0 0 4px}
.thumb{width:100%;aspect-ratio:16/9;max-height:60vh;overflow:hidden;background:var(--thumb-bg);position:relative;border-radius:10px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:rgba(255,255,255,.45);background:radial-gradient(circle at center,rgba(255,0,51,.18) 0%,transparent 65%)}
[data-theme="light"] .thumb .play{color:rgba(0,0,0,.35);background:radial-gradient(circle at center,rgba(255,0,51,.12) 0%,transparent 65%)}
.dur-badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:10px;font-weight:600;padding:2px 4px;border-radius:3px}
.card-info{padding:8px 4px 0;display:flex;gap:10px}
.card-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;overflow:hidden;color:#fff;font-weight:700}
.card-avatar img{width:100%;height:100%;object-fit:cover}
.card-body{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:500;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:var(--muted);line-height:1.4}

.compact-filters{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.compact-filters::-webkit-scrollbar{display:none}
.filter-chip{background:var(--bg3);border:none;color:var(--text);padding:7px 12px;border-radius:16px;font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--text);color:var(--bg)}
.compact-grid{display:flex;flex-direction:column;gap:8px;padding:0 14px 20px}
.compact-item{display:flex;gap:10px;cursor:pointer;padding:6px;border-radius:10px}
.compact-item .thumb{width:140px;aspect-ratio:16/9;border-radius:8px;flex-shrink:0;position:relative;background:var(--thumb-bg);overflow:hidden;max-height:none}
.compact-item .thumb img{width:100%;height:100%;object-fit:cover}
.compact-item .thumb .play{font-size:32px}
.compact-item .info{flex:1;min-width:0;padding-top:2px}
.compact-item .info h3{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.compact-item .info .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.compact-item .info .stats-row{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.compact-item .menu-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:0 6px;align-self:flex-start;flex-shrink:0}

.chan-grid{display:flex;flex-direction:column;gap:14px;padding:10px 0}
.chan-grid .card{cursor:pointer;padding:0}
.chan-grid .thumb{width:100%;aspect-ratio:16/9;max-height:none;border-radius:10px;overflow:hidden;background:var(--thumb-bg);position:relative}
.chan-grid .thumb img{width:100%;height:100%;object-fit:cover}
.chan-grid .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(255,255,255,.45);background:radial-gradient(circle at center,rgba(255,0,51,.18) 0%,transparent 65%)}
[data-theme="light"] .chan-grid .thumb .play{color:rgba(0,0,0,.35);background:radial-gradient(circle at center,rgba(255,0,51,.12) 0%,transparent 65%)}
.chan-grid .card-info{display:flex;gap:10px;padding:10px 4px 0}
.chan-grid .card-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.chan-grid .card-body{flex:1;min-width:0}
.chan-grid .card-title{font-size:14px;font-weight:500;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chan-grid .card-meta{font-size:11px;color:var(--muted)}

.studio-wrap{display:flex;flex-direction:column;width:100%;padding:14px;gap:0}
.studio-side{display:flex;flex-direction:row;overflow-x:auto;width:100%;padding:8px 0;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;scrollbar-width:none}
.studio-side::-webkit-scrollbar{display:none}
.studio-side .studio-brand{display:none}
.studio-side .divider{display:none}
.studio-side button{margin-bottom:0;white-space:nowrap;font-size:12px;padding:8px 12px;border-radius:16px;width:auto;background:none;border:none;color:var(--text);display:flex;align-items:center;gap:6px;font-weight:500}
.studio-side button.active{background:var(--text);color:var(--bg)}
.studio-side button .ic{font-size:15px}
.studio-main{flex:1;min-width:0;width:100%}
.studio h1{font-size:18px;margin-bottom:4px}
.studio .sub{color:var(--muted);font-size:11px;margin-bottom:16px}
.studio-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.studio-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.studio-card .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;font-weight:600}
.studio-card .value{font-size:20px;font-weight:700;line-height:1.1}
.studio-card .delta{font-size:10px;color:#4caf50;margin-top:3px}
.chart-box{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.chart-box h3{font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chart-box h3 span{font-size:10px;color:var(--muted);font-weight:normal}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px}
.chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),rgba(255,0,51,.3));border-radius:4px 4px 2px 2px;min-height:4px}
.chart-labels{display:flex;gap:6px;margin-top:6px}
.chart-labels div{flex:1;text-align:center;font-size:9px;color:var(--muted)}
.empty-chart{text-align:center;color:var(--muted);font-size:12px;padding:26px 0}
.week-summary{background:linear-gradient(135deg,rgba(255,0,51,.15),rgba(255,138,0,.15));border:1px solid rgba(255,0,51,.4);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.week-summary b{font-size:13px}
.week-summary .emoji{font-size:28px;flex-shrink:0}
.studio-section{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.studio-section h4{font-size:13px;margin-bottom:10px;font-weight:600}
.content-table{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.content-row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center}
.content-row:last-child{border-bottom:none}
.content-row .check{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.content-row .thumb{width:80px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--thumb-bg);flex-shrink:0;cursor:pointer;max-height:none}
.content-row .thumb img{width:100%;height:100%;object-fit:cover}
.content-row .body{flex:1;min-width:0;cursor:pointer}
.content-row .body b{display:block;font-size:13px;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content-row .body .meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.content-row .menu-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:4px 8px;cursor:pointer;flex-shrink:0}
.content-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.content-filters input{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-size:13px;outline:none;flex:1;min-width:180px}

.community{padding:14px;width:100%}
.post-box{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px}
.post-box textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;resize:vertical;min-height:55px;outline:none;line-height:1.5}
.post-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.post-row input[type=file]{font-size:11px;color:var(--muted);max-width:160px}
.post{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.post-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.post-head .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.post-head .avatar img{width:100%;height:100%;object-fit:cover}
.post-head .name{font-size:13px;font-weight:600}
.post-head .time{font-size:11px;color:var(--muted);margin-top:2px}
.post-menu-btn{margin-left:auto;background:none;border:none;color:var(--muted);font-size:17px;padding:2px 6px;border-radius:6px}
.post-text{font-size:13px;line-height:1.5;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.post-img{width:100%;border-radius:8px;margin-bottom:10px;background:var(--bg3)}
.post-actions{display:flex;gap:12px;align-items:center;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}
.post-actions button{background:none;border:none;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px}
.post-actions button.liked{color:var(--accent)}
.post-actions button.disliked{color:#f44336}
.post-actions .spacer{flex:1}
.post-menu-popup{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:6px 0;box-shadow:0 4px 20px rgba(0,0,0,.5);position:fixed;z-index:3000;min-width:180px}
.post-menu-popup button{display:flex;gap:10px;width:100%;background:none;border:none;padding:10px 14px;font-size:13px;text-align:left;color:var(--text)}
.post-menu-popup button:hover{background:var(--hover)}
.post-reply{background:var(--bg2);border-radius:8px;padding:8px;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.post-reply .avatar{width:26px;height:26px;font-size:11px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.post-reply .body{font-size:12px;flex:1;min-width:0}
.post-reply .body b{font-size:12px;display:block;margin-bottom:2px}

.post-reply-input input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:6px 2px;outline:none;font-size:12px}

.watch{padding:0 0 20px;width:100%}
.watch h1{font-size:16px;line-height:1.35;margin:12px 14px 8px;font-weight:600;word-break:break-word}
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none}
.player-wrap video{width:100%;height:100%;display:block;background:#000}
.bottom-controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:28px 10px 8px;opacity:0;transition:opacity .2s;pointer-events:none}
.player-wrap.show-controls .bottom-controls{opacity:1;pointer-events:auto}
.progress{height:3px;background:rgba(255,255,255,.28);border-radius:3px;cursor:pointer;position:relative;margin-bottom:8px}
.progress .buffered{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.4);border-radius:3px}
.progress .played{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.ctrl-row{display:flex;align-items:center;gap:2px;color:#fff}
.ctrl-row button{background:none;border:none;color:#fff;font-size:14px;padding:4px;border-radius:6px;min-width:32px;height:32px}

.ctrl-row .spacer{flex:1}
.action-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.action-row::-webkit-scrollbar{display:none}
.chip{background:var(--bg3);border:none;padding:9px 14px;border-radius:20px;font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;min-height:38px;transition:.15s}
.chip.liked{color:#4caf50;background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.4)}
.chip.disliked{color:#f44336;background:rgba(244,67,54,.15);border:1px solid rgba(244,67,54,.4)}
.comments{padding:0 14px}
.comment{display:flex;gap:10px;margin-bottom:16px;position:relative}
.comment .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.comment .body{flex:1;min-width:0}
.comment .head{font-size:11px;margin-bottom:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.comment .head b{font-size:12px;font-weight:600}

function openRegisterModal(){
  openModal(`<h2>Регистрация</h2><div id="regErr"></div><div class="field"><label>Название канала *</label><input type="text" id="rName" maxlength="30" placeholder="Kolya Games"></div><div class="field"><label>Email *</label><input type="email" id="rEmail" maxlength="80"></div><div class="field"><label>Пароль *</label><input type="password" id="rPass" maxlength="60"></div><div class="modal-actions"><button class="auth-btn" onclick="closeModal()">Отмена</button><button class="submit" id="rSubmit">Создать</button></div><div class="switch-line">Уже есть? <a onclick="openLoginModal()">Войти</a></div>`);
  setTimeout(()=>$('#rName')?.focus(),50);
  $('#rSubmit').onclick = async () => {
    const name=$('#rName').value.trim(),email=$('#rEmail').value.trim(),pass=$('#rPass').value;
    if(name.length<2){$('#regErr').innerHTML='<div class="error-msg">Название: минимум 2 символа</div>';return;}
    if(!email.includes('@')){$('#regErr').innerHTML='<div class="error-msg">Правильный email</div>';return;}
    if(pass.length<6){$('#regErr').innerHTML='<div class="error-msg">Пароль: мин. 6 символов</div>';return;}
    const btn=$('#rSubmit');btn.disabled=true;btn.textContent='Создаём...';
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      await updateProfile(cred.user,{displayName:name});
      localStorage.setItem('vidtube_name_'+cred.user.uid,name);
      await sendEmailVerification(cred.user);
      setChannelConfig({...DEFAULT_CHANNEL,name,handle:makeHandle(name),createdAt:Date.now()});
      closeModal();
      openModal(`<span style="font-size:44px;text-align:center;display:block;margin-bottom:12px">📧</span><div style="font-size:18px;font-weight:700;text-align:center;margin-bottom:8px">Письмо отправлено!</div><div style="font-size:13px;color:var(--muted);line-height:1.5;text-align:center;margin-bottom:18px">Мы отправили письмо на<br><b style="color:var(--text)">${esc(email)}</b><br><br>Проверьте Входящие и Спам.</div><button class="submit" style="width:100%" onclick="closeModal()">Понятно</button>`);
    }catch(err){
      let msg=err.message;
      if(err.code==='auth/email-already-in-use')msg='Этот email уже зарегистрирован';
      else if(err.code==='auth/invalid-email')msg='Некорректный email';
      else if(err.code==='auth/weak-password')msg='Слабый пароль';
      $('#regErr').innerHTML=`<div class="error-msg">${esc(msg)}</div>`;
      btn.disabled=false;btn.textContent='Создать';
    }
  };
}
window.openRegisterModal = openRegisterModal;

function openLoginModal(){
  openModal(`<h2>Вход в VidTube</h2><div id="loginErr"></div><div class="field"><label>Email</label><input type="email" id="lEmail" maxlength="80"></div><div class="field"><label>Пароль</label><input type="password" id="lPass" maxlength="60"></div><div class="modal-actions"><button class="auth-btn" onclick="closeModal()">Отмена</button><button class="submit" id="lSubmit">Войти</button></div><div class="switch-line"><a onclick="openResetModal()">Забыли пароль?</a> · <a onclick="openRegisterModal()">Создать</a></div>`);
  setTimeout(()=>$('#lEmail')?.focus(),50);
  const go = async () => {
    const email=$('#lEmail').value.trim(),pass=$('#lPass').value;
    const btn=$('#lSubmit');btn.disabled=true;btn.textContent='Входим...';
    try{
      const cred=await signInWithEmailAndPassword(auth,email,pass);
      if(!cred.user.emailVerified){await signOut(auth);$('#loginErr').innerHTML='<div class="error-msg">Email не подтверждён. Проверьте почту.</div>';btn.disabled=false;btn.textContent='Войти';return;}
      closeModal();toast('С возвращением!');
    }catch(err){
      let msg=err.message;
      if(err.code==='auth/user-not-found')msg='Пользователь не найден';
      else if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')msg='Неверный email или пароль';
      $('#loginErr').innerHTML=`<div class="error-msg">${esc(msg)}</div>`;
      btn.disabled=false;btn.textContent='Войти';
    }
  };
  $('#lSubmit').onclick=go;
  $('#lPass').onkeydown=e=>{if(e.key==='Enter')go();};
}

const app=document.getElementById('app');
async function render(){
  clearUrls();
  const hash=location.hash.slice(1)||'/';
  const parts=hash.split('/').filter(Boolean);
  const key='/'+(parts[0]||'');
  $$('.sidebar button[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===key));
  let bkey=key;
  if(key==='/settings')bkey='';
  if(key==='/watch')bkey='';
  $$('.bottom-nav button[data-bnav]').forEach(b=>b.classList.toggle('active',b.dataset.bnav===bkey));

  /* Прячем обычный сайдбар в Студии */
  document.body.classList.toggle('in-studio', parts[0]==='studio');

  renderAuthArea();
  const user=getCurrentUser();
  if(parts[0]==='settings'){renderSettings();return;}
  if(parts[0]==='channel'){
    if(!user){renderAuthGate('Мой канал');return;}
    const tab=parts[1]||'home';
    await renderChannel(tab);return;
  }
  if(parts[0]==='subs'){if(!user){renderAuthGate('Подписки');return;}renderSubs();return;}
  if(parts[0]==='studio'){if(!user){renderAuthGate('Творческая студия');return;}await renderStudio(parts[1]||'home');return;}
  if(parts[0]==='create'){if(!user){renderAuthGate('Создание видео');return;}renderCreate();return;}
  if(parts[0]==='watch'){await renderWatch(parts[1]);return;}
  await renderHome();
}
on(window,'hashchange',()=>render());

function attachPostHandlers(){
  $$('[data-pact]').forEach(b=>b.onclick=async()=>{
    const act=b.dataset.pact,id=b.dataset.id;
    const p=await dbGet('posts',id);if(!p)return;
    if(act==='plike'){p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);if(p.liked&&p.disliked){p.disliked=false;p.dislikes=Math.max(0,(p.dislikes||0)-1);}}
    else if(act==='pdislike'){p.disliked=!p.disliked;p.dislikes=(p.dislikes||0)+(p.disliked?1:-1);if(p.disliked&&p.liked){p.liked=false;p.likes=Math.max(0,(p.likes||0)-1);}}
    else if(act==='pshare'){const url=location.origin+location.pathname+'#/channel/community';if(navigator.share)navigator.share({url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Ссылка скопирована')).catch(()=>{});else prompt('Ссылка:',url);return;}
    else if(act==='pcomment'){const inp=document.querySelector(`[data-pinput="${id}"]`);inp?.focus();return;}
    await dbPut('posts',p);render();
  });
  $$('[data-psend]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.psend;
    const inp=document.querySelector(`[data-pinput="${id}"]`);
    const text=inp.value.trim();if(!text)return;
    const u=getCurrentUser();
    const p=await dbGet('posts',id);if(!p)return;
    p.comments=p.comments||[];
    p.comments.push({author:u?.name||'Гость',text,date:Date.now()});
    await dbPut('posts',p);render();
  });
  $$('[data-pmenu]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    document.querySelectorAll('.post-menu-popup').forEach(m=>m.remove());
    const id=b.dataset.pmenu;
    const p=await dbGet('posts',id);if(!p)return;
    const rect=b.getBoundingClientRect();
    const menu=document.createElement('div');
    menu.className='post-menu-popup';
    menu.style.cssText=`position:fixed;top:${Math.min(rect.bottom+4,window.innerHeight-200)}px;right:10px;`;
    menu.innerHTML=`<button data-pedit="${id}">✏ Редактировать</button><button data-pcopylink="${id}">🔗 Копировать ссылку</button><button data-pdel="${id}" style="color:#ff8888">🗑 Удалить</button>`;
    document.body.appendChild(menu);
    menu.querySelector(`[data-pdel="${id}"]`).onclick=async()=>{menu.remove();if(!confirm('Удалить пост?'))return;await dbDel('posts',id);render();};
    menu.querySelector(`[data-pcopylink="${id}"]`).onclick=()=>{menu.remove();const url=location.origin+location.pathname+'#/channel/community';if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Ссылка скопирована'));else prompt('Ссылка:',url);};
    menu.querySelector(`[data-pedit="${id}"]`).onclick=()=>{menu.remove();openPostEdit(p);};
    const close=ev=>{if(!menu.contains(ev.target)){menu.remove();document.removeEventListener('click',close);}};
    setTimeout(()=>document.addEventListener('click',close),50);
  });
}

function renderStudioAnalytics(videos,cfg){
  const totalViews=videos.reduce((s,v)=>s+(v.views||0),0);
  const totalLikes=videos.reduce((s,v)=>s+(v.likes||0),0);
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);const next=new Date(d);next.setDate(next.getDate()+1);const dayVideos=videos.filter(v=>v.date>=d.getTime()&&v.date<next.getTime());const dayViews=dayVideos.reduce((s,v)=>s+(v.views||0),0);days.push({label:d.toLocaleDateString('ru-RU',{weekday:'short'}),views:dayViews});}
  const maxV=Math.max(...days.map(d=>d.views),1);
  const hasData=days.some(d=>d.views>0);
  const topVideos=[...videos].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,10);
  return `
    <h1 style="font-size:18px;margin-bottom:14px">Аналитика канала</h1>
    <div class="studio-stats">
      <div class="studio-card"><div class="label">Просмотры</div><div class="value">${fmtNum(totalViews)}</div><div class="delta">за всё время</div></div>
      <div class="studio-card"><div class="label">Лайки</div><div class="value">${fmtNum(totalLikes)}</div><div class="delta">на видео</div></div>
      <div class="studio-card"><div class="label">Подписчики</div><div class="value">${fmtNum(cfg.subscribers||0)}</div><div class="delta">на канале</div></div>
      <div class="studio-card"><div class="label">Видео</div><div class="value">${videos.length}</div><div class="delta">всего</div></div>
    </div>
    <div class="chart-box">
      <h3>Просмотры за 7 дней <span>по дате загрузки</span></h3>
      ${hasData?`<div class="chart">${days.map(d=>`<div class="bar" style="height:${Math.max(4,d.views/maxV*100)}%"></div>`).join('')}</div><div class="chart-labels">${days.map(d=>`<div>${d.label}</div>`).join('')}</div>`:'<div class="empty-chart">Пока нет данных для графика</div>'}
    </div>
    <div class="chart-box">
      <h3>Топ-10 видео <span>по просмотрам</span></h3>
      ${topVideos.length?topVideos.map((v,i)=>`
        <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:14px;font-weight:700;color:var(--muted);width:22px;text-align:center">${i+1}</div>
          <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.title)}</div><div style="font-size:10px;color:var(--muted);margin-top:2px">👁 ${fmtNum(v.views)} · 👍 ${fmtNum(v.likes)} · 💬 ${(v.comments||[]).length}</div></div>
        </div>
      `).join(''):'<div class="empty-chart">Пока нет видео</div>'}
    </div>`;
}

function renderCommentList(allComments,currentUser){
  const roots=allComments.filter(c=>!c.parentId);
  const pinned=roots.filter(c=>c.pinned);
  const regular=roots.filter(c=>!c.pinned);
  const sorted=[...pinned,...regular];
  if(!sorted.length)return'<p style="color:var(--muted);font-size:13px" id="noComments">Комментариев пока нет. Будьте первым!</p>';
  return sorted.map(c=>renderCommentTree(c,allComments,currentUser)).join('');
}
function renderCommentTree(c,allComments,currentUser){
  const replies=allComments.filter(x=>x.parentId===c.id);
  const cfg=getChannelConfig();
  const isOwner=currentUser&&(currentUser.name===cfg.name);
  const isAuthor=currentUser&&c.authorId===currentUser.uid;
  const canPin=isOwner||isAuthor;const canHeart=isOwner;const canDelete=isOwner||isAuthor;
  return`<div class="comment ${c.pinned?'pinned':''}" data-comment="${c.id}"><div class="avatar">${esc((c.author||'Г')[0].toUpperCase())}</div><div class="body">${c.pinned?'<div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:5px">📌 Закреплено автором</div>':''}<div class="head"><b>${esc(c.author)}</b>${isOwner?'<span class="author-badge">АВТОР</span>':''}<span>${timeAgo(c.date)}</span>${c.hearted?'<span class="heart">❤</span>':''}</div><p>${renderHashtags(c.text)}</p><div class="comment-actions"><button data-act="clike" data-id="${c.id}" class="${(c.likedBy||[]).includes(currentUser?.uid)?'liked':''}">👍 <span data-count="clike-${c.id}">${fmtNum(c.likes||0)}</span></button><button data-act="cdislike" data-id="${c.id}" class="${(c.dislikedBy||[]).includes(currentUser?.uid)?'disliked':''}">👎 <span data-count="cdislike-${c.id}">${fmtNum(c.dislikes||0)}</span></button>${currentUser?`<button data-act="reply" data-id="${c.id}">Ответить</button>`:''}${(canPin||canHeart||canDelete)?`<button class="menu-btn" data-act="menu" data-id="${c.id}">⋮</button>`:''}</div><div id="replyBox-${c.id}"></div>${replies.length?`<div class="replies">${replies.map(r=>renderCommentTree(r,allComments,currentUser)).join('')}</div>`:''}</div></div>`;
}
function attachCommentHandlers(v,u,videoId){
  $$('#commentList [data-act]').forEach(btn=>{
    btn.onclick=async e=>{
      e.stopPropagation();
      const act=btn.dataset.act;const cid=btn.dataset.id;
      if(act==='menu')return openCommentMenu(btn,cid,videoId,u);
      if(act==='reply')return openReplyBox(cid,videoId,u);
      if(act==='clike'||act==='cdislike')return toggleCommentVote(videoId,cid,act==='clike'?'like':'dislike',u);
    };
  });
}
async function toggleCommentVote(videoId,commentId,type,u){
  if(!u){openLoginModal();return;}
  const btn=document.querySelector(`[data-act="${type==='like'?'clike':'cdislike'}"][data-id="${commentId}"]`);
  const otherType=type==='like'?'cdislike':'clike';
  const otherBtn=document.querySelector(`[data-act="${otherType}"][data-id="${commentId}"]`);
  const countSpan=document.querySelector(`[data-count="${type==='like'?'clike':'cdislike'}-${commentId}"]`);
  const otherCountSpan=document.querySelector(`[data-count="${otherType}-${commentId}"]`);
  const wasActive=btn.classList.contains(type==='like'?'liked':'disliked');
  const otherWasActive=otherBtn?.classList.contains(type==='like'?'disliked':'liked');
  if(type==='like'){btn.classList.toggle('liked',!wasActive);if(otherBtn&&otherWasActive)otherBtn.classList.remove('disliked');}
  else{btn.classList.toggle('disliked',!wasActive);if(otherBtn&&otherWasActive)otherBtn.classList.remove('liked');}
  const curCount=parseInt(countSpan.textContent.replace(/[^0-9]/g,''))||0;
  countSpan.textContent=fmtNum(wasActive?Math.max(0,curCount-1):curCount+1);
  if(otherWasActive&&otherCountSpan){const oc=parseInt(otherCountSpan.textContent.replace(/[^0-9]/g,''))||0;otherCountSpan.textContent=fmtNum(Math.max(0,oc-1));}
  const fresh=await dbGet('videos',videoId);
  const c=(fresh.comments||[]).find(x=>x.id===commentId);if(!c)return;
  c.likedBy=c.likedBy||[];c.dislikedBy=c.dislikedBy||[];
  const inLiked=c.likedBy.includes(u.uid);const inDisliked=c.dislikedBy.includes(u.uid);
  if(type==='like'){if(inLiked)c.likedBy=c.likedBy.filter(e=>e!==u.uid);else{c.likedBy.push(u.uid);c.dislikedBy=c.dislikedBy.filter(e=>e!==u.uid);}}
  else{if(inDisliked)c.dislikedBy=c.dislikedBy.filter(e=>e!==u.uid);else{c.dislikedBy.push(u.uid);c.likedBy=c.likedBy.filter(e=>e!==u.uid);}}
  c.likes=c.likedBy.length;c.dislikes=c.dislikedBy.length;
  await dbPut('videos',fresh);
}
function openReplyBox(commentId,videoId,u){
  if(!u){openLoginModal();return;}
  const box=document.getElementById('replyBox-'+commentId);if(!box)return;
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML=`<div class="reply-box"><div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700">${esc((u.name||u.email)[0].toUpperCase())}</div><div style="flex:1"><input type="text" id="reply-${commentId}" placeholder="Ответить..." maxlength="500"><div class="reply-actions"><button data-cancel="${commentId}">Отмена</button><button class="send" data-send="${commentId}">Ответить</button></div></div></div>`;
  const inp=document.getElementById('reply-'+commentId);inp.focus();
  $('[data-cancel]',box).onclick=()=>{box.innerHTML='';};
  const send=async()=>{const text=inp.value.trim();if(!text)return;const fresh=await dbGet('videos',videoId);fresh.comments=fresh.comments||[];fresh.comments.push({id:'c'+Date.now(),author:u.name||u.email,authorId:u.uid,text,date:Date.now(),likes:0,dislikes:0,hearted:false,pinned:false,likedBy:[],dislikedBy:[],parentId:commentId});await dbPut('videos',fresh);const list=$('#commentList');if(list){list.innerHTML=renderCommentList(fresh.comments,u);attachCommentHandlers(null,u,videoId);}};
  $('[data-send]',box).onclick=send;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send();}};
}
function openCommentMenu(btn,commentId,videoId,u){
  document.querySelectorAll('.comment-menu').forEach(m=>m.remove());
  const rect=btn.getBoundingClientRect();
  const menu=document.createElement('div');
  menu.className='comment-menu';
  menu.style.cssText=`position:fixed;top:${Math.min(rect.bottom+4,window.innerHeight-220)}px;right:10px;`;
  (async()=>{
    const fresh=await dbGet('videos',videoId);
    const c=(fresh.comments||[]).find(x=>x.id===commentId);if(!c)return;
    const cfg=getChannelConfig();
    const isOwner=u&&(u.name===cfg.name);
    const isAuthor=u&&c.authorId===u.uid;
    const canPin=isOwner||isAuthor;const canHeart=isOwner;const canDelete=isOwner||isAuthor;
    let html='';
    if(canPin)html+=`<button data-mact="pin" data-id="${commentId}">${c.pinned?'📌 Открепить':'📌 Закрепить'}</button>`;
    if(canHeart)html+=`<button data-mact="heart" data-id="${commentId}">${c.hearted?'❤ Убрать сердечко':'❤ Поставить сердечко'}</button>`;
    if(canDelete)html+=`<button data-mact="delete" data-id="${commentId}" style="color:#ff8888">🗑 Удалить</button>`;
    if(!html)html='<button disabled style="color:#888">Нет действий</button>';
    menu.innerHTML=html;
    menu.querySelectorAll('[data-mact]').forEach(b=>b.onclick=async()=>{
      const act=b.dataset.mact;menu.remove();
      const fr=await dbGet('videos',videoId);if(!fr.comments)fr.comments=[];
      if(act==='delete'){fr.comments=fr.comments.filter(x=>x.id!==commentId&&x.parentId!==commentId);await dbPut('videos',fr);document.querySelector(`[data-comment="${commentId}"]`)?.remove();const total=fr.comments.filter(x=>!x.parentId).length;$('#cCount').textContent=total+' '+plural(total,'комментарий','комментария','комментариев');if(!total)$('#commentList').innerHTML='<p style="color:var(--muted);font-size:13px" id="noComments">Комментариев пока нет. Будьте первым!</p>';}
      else if(act==='pin'){const cm=fr.comments.find(x=>x.id===commentId);if(cm){fr.comments.forEach(x=>{if(x.id!==commentId)x.pinned=false;});cm.pinned=!cm.pinned;await dbPut('videos',fr);$('#commentList').innerHTML=renderCommentList(fr.comments,u);attachCommentHandlers(null,u,videoId);}}
      else if(act==='heart'){const cm=fr.comments.find(x=>x.id===commentId);if(cm){cm.hearted=!cm.hearted;await dbPut('videos',fr);$('#commentList').innerHTML=renderCommentList(fr.comments,u);attachCommentHandlers(null,u,videoId);}}
    });
    document.body.appendChild(menu);
    const close=e=>{if(!menu.contains(e.target)){menu.remove();document.removeEventListener('click',close);}};
    setTimeout(()=>document.addEventListener('click',close),50);
  })();
}

function setupPlayer(video,wrap){
  const played=$('#played',wrap),buffered=$('#buffered',wrap),tCur=$('#tCur',wrap),tDur=$('#tDur',wrap),progress=$('#progress',wrap);
  const btn=act=>wrap.querySelector(`[data-act="${act}"]`);
  video.addEventListener('loadedmetadata',()=>{tDur.textContent=fmtTime(video.duration);});
  video.addEventListener('play',()=>{$('#playBtn').textContent='⏸';showCtrl();});
  video.addEventListener('pause',()=>{$('#playBtn').textContent='▶';showCtrl(true);});
  video.addEventListener('timeupdate',()=>{const d=video.duration||0;played.style.width=d?(video.currentTime/d*100)+'%':'0';tCur.textContent=fmtTime(video.currentTime);if(video.buffered.length){const b=d?(video.buffered.end(video.buffered.length-1)/d*100):0;buffered.style.width=b+'%';}});
  const seek=e=>{const r=progress.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(1,x/r.width))*video.duration;};
  let dragging=false;
  on(progress,'mousedown',e=>{dragging=true;seek(e);e.preventDefault();});
  on(progress,'touchstart',e=>{dragging=true;seek(e);},{passive:true});
  on(window,'mousemove',e=>{if(dragging)seek(e);});
  on(window,'touchmove',e=>{if(dragging)seek(e);},{passive:true});
  on(window,'mouseup',()=>dragging=false);on(window,'touchend',()=>dragging=false);
  on(btn('play'),'click',()=>video.paused?video.play():video.pause());
  on(btn('back10'),'click',()=>video.currentTime=Math.max(0,video.currentTime-10));
  on(btn('fwd10'),'click',()=>video.currentTime=Math.min(video.duration||0,video.currentTime+10));
  on(btn('pip'),'click',async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await video.requestPictureInPicture();}catch{}});
  on(btn('fullscreen'),'click',()=>{if(document.fullscreenElement)document.exitFullscreen();else(wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.webkitEnterFullscreen).call(wrap);});
  let hideTimer;
  function showCtrl(stay=false){wrap.classList.add('show-controls');clearTimeout(hideTimer);if(!stay&&!video.paused)hideTimer=setTimeout(()=>wrap.classList.remove('show-controls'),2500);}
  on(wrap,'mousemove',()=>showCtrl());on(wrap,'touchstart',()=>showCtrl());
  on(video,'click',()=>video.paused?video.play():video.pause());
  on(video,'dblclick',()=>btn('fullscreen').click());
  showCtrl(true);
  video.muted=true;
  const tryPlay=()=>{
    const p=video.play();
    if(p!==undefined){
      p.then(()=>{setTimeout(()=>{video.muted=false;},300);}).catch(()=>{
        const unmute=()=>{video.muted=false;video.play().catch(()=>{});document.removeEventListener('click',unmute);document.removeEventListener('touchstart',unmute);};
        document.addEventListener('click',unmute,{once:true});
        document.addEventListener('touchstart',unmute,{once:true});
      });
    }
  };
  if(video.readyState>=2)tryPlay();
  else video.addEventListener('loadeddata',tryPlay,{once:true});
}
