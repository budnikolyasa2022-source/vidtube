<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>VidTube 0.0.7α</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ff0033'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
<style>
:root{
  --bg:#0f0f0f; --bg2:#181818; --bg3:#272727; --text:#f1f1f1; --muted:#aaa;
  --accent:#ff0033; --border:#303030; --radius:12px;
  --header-h:56px; --bottom-nav-h:56px; --sidebar-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* =============== Шапка =============== */
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:rgba(15,15,15,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);min-height:var(--header-h)}
.logo{font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo .dot{width:26px;height:18px;background:var(--accent);border-radius:4px;display:flex;
  align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0}
.logo .ver{font-size:10px;color:var(--muted);font-weight:600;background:var(--bg3);padding:2px 6px;border-radius:6px}
.search{flex:1;display:none;max-width:520px}
.search input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:20px 0 0 20px;
  padding:10px 14px;color:var(--text);outline:none;font-size:14px;min-width:0}
.search button{background:var(--bg3);border:1px solid var(--border);border-left:none;
  border-radius:0 20px 20px 0;padding:0 16px;color:var(--text);font-size:14px;min-height:40px}
.top-search-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;margin-left:auto}
#authArea{display:flex;gap:6px;align-items:center;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;background:var(--bg2);
  border:1px solid var(--border);border-radius:20px;font-size:13px;max-width:130px;cursor:pointer}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.auth-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 12px;
  border-radius:20px;font-size:13px;white-space:nowrap;min-height:36px}
.auth-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

main{padding-bottom:calc(var(--bottom-nav-h) + 20px + env(safe-area-inset-bottom))}

/* =============== Нижняя навигация (мобильная) =============== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(15,15,15,.98);
  backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav button{flex:1;background:none;color:var(--muted);padding:8px 4px 6px;font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.bottom-nav button.active{color:var(--text)}
.bottom-nav button.active .ic{color:var(--accent)}
.bottom-nav .ic{font-size:20px;line-height:1}
.bottom-nav .plus{width:34px;height:34px;border-radius:50%;background:var(--bg3);display:flex;
  align-items:center;justify-content:center;font-size:20px}

/* =============== Сайдбар (ПК) =============== */
.sidebar{display:none}

/* =============== Сетка видео =============== */
.grid{display:flex;flex-direction:column;gap:14px;padding:10px 0 20px}
.card{cursor:pointer;transition:.15s;padding:0 0 8px}
.card:active{background:var(--bg2)}
.thumb{width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:42px;color:rgba(255,255,255,.5)}
.duration-badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;
  font-size:11px;font-weight:600;padding:2px 5px;border-radius:4px}
.card-info{padding:10px 12px 0;display:flex;gap:12px;align-items:flex-start}
.card-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;color:#fff;font-weight:700}
.card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.card-body{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:500;line-height:1.35;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;color:var(--muted);line-height:1.4}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:12px;font-size:20px}
.empty p{margin-bottom:20px;line-height:1.5;font-size:14px}

/* =============== Просмотр =============== */
.watch{padding:0 0 20px}
.watch h1{font-size:17px;line-height:1.35;margin:14px 14px 8px;font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;color:#fff;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.action-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
.action-row::-webkit-scrollbar{display:none}
.chip{background:var(--bg3);border:none;color:var(--text);padding:8px 14px;border-radius:20px;
  font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.chip.liked,.chip.disliked{background:var(--text);color:#000}

/* =============== Player =============== */
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;touch-action:manipulation}
.player-wrap video,.player-wrap iframe{width:100%;height:100%;display:block;border:0;background:#000}
.bottom-controls{position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.85));padding:30px 12px 8px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.player-wrap.show-controls .bottom-controls{opacity:1;pointer-events:auto}
.progress{height:3px;background:rgba(255,255,255,.28);border-radius:3px;cursor:pointer;
  position:relative;margin-bottom:8px}
.progress .buffered{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.4);border-radius:3px;width:0}
.progress .played{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0}
.ctrl-row{display:flex;align-items:center;gap:2px;color:#fff}
.ctrl-row button{background:none;border:none;color:#fff;font-size:15px;
  padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  min-width:34px;height:34px}
.ctrl-row button svg{width:20px;height:20px;fill:#fff}
.ctrl-row .time{font-size:12px;color:#e5e5e5;font-variant-numeric:tabular-nums;margin-left:6px;white-space:nowrap}
.ctrl-row .spacer{flex:1}

/* =============== Формы =============== */
.page{padding:20px 16px 40px;max-width:600px;margin:0 auto}
.page h1{font-size:21px;margin-bottom:6px}
.page .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field input[type=text],.field input[type=password],.field input[type=email],.field textarea,.field input[type=file]{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-size:14px;outline:none;min-height:44px}
.field textarea{resize:vertical;min-height:100px;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:#666}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.submit{background:var(--accent);color:#fff;border:none;padding:12px 26px;border-radius:22px;
  font-size:15px;font-weight:600;min-height:44px}
.submit:disabled{opacity:.5;cursor:not-allowed}

/* =============== Канал =============== */
.banner{height:130px;background-size:cover;background-position:center;border-radius:0 0 14px 14px}
.chan-header{padding:0 16px;margin-top:-40px}
.chan-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#ff8a00);
  border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px;
  overflow:hidden;color:#fff;font-weight:700}
.chan-avatar img{width:100%;height:100%;object-fit:cover}
.chan-info{margin-top:10px}
.chan-info h1{font-size:21px;margin-bottom:6px}
.chan-info .stats{color:var(--muted);font-size:13px;margin-bottom:6px;line-height:1.4}
.chan-actions{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.edit-btn{background:var(--bg3);border:none;color:var(--text);padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 16px;margin-top:20px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:var(--muted);padding:13px 14px;font-size:13px;
  font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--text)}

.about-section{padding:22px 16px 40px}
.about-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:22px}
.about-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}
.about-card .label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.about-card .value{font-size:20px;font-weight:700;line-height:1.15}
.about-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.about-card.desc-card{grid-column:1/-1}
.about-card.desc-card .value{font-size:14px;font-weight:400;line-height:1.55;white-space:pre-wrap;word-break:break-word}
@media(min-width:480px){.about-grid{grid-template-columns:1fr 1fr}}

.community{padding:20px 14px 40px}
.post-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:22px}
.post-box textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:15px;
  resize:vertical;min-height:60px;outline:none;line-height:1.5}
.post{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}

/* =============== Комментарии =============== */
.comments{padding:0 14px}
.comment{display:flex;gap:10px;margin-bottom:18px;position:relative}
.comment .body{flex:1;min-width:0}
.comment .head{font-size:12px;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.comment .head b{font-size:13px;font-weight:600}
.comment .head .author-badge{background:var(--accent);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;letter-spacing:.3px}
.comment .head span{color:var(--muted)}
.comment p{font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.comment.pinned{background:rgba(255,255,255,.03);border-radius:10px;padding:10px;margin-left:-10px;margin-right:-10px}
.comment .pin-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.comment .heart{color:var(--accent);font-size:12px;margin-left:4px}

.comment-actions{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.comment-actions button{background:none;border:none;color:var(--muted);font-size:12px;
  display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px}
.comment-actions button.liked{color:#4caf50}
.comment-actions button.disliked{color:#f44336}
.comment-actions button.hearted{color:var(--accent)}
.comment-actions .menu-btn{margin-left:auto;font-size:16px;padding:3px 8px}

.comment-menu{position:fixed;background:#282828;border-radius:10px;padding:6px 0;
  box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:3000;min-width:180px}
.comment-menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;
  border:none;color:var(--text);padding:10px 16px;font-size:14px;text-align:left}
.comment-menu button:hover{background:rgba(255,255,255,.08)}

.reply-box{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.reply-box input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--text);padding:6px 2px;outline:none;font-size:13px}
.reply-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.reply-actions button{background:none;border:none;color:var(--muted);padding:6px 12px;
  font-size:12px;border-radius:14px}
.reply-actions .send{background:var(--accent);color:#fff}

.replies{margin-top:12px;padding-left:22px;border-left:2px solid var(--border)}
.replies .comment{margin-bottom:14px}

/* =============== Модалка =============== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;z-index:1000}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto}
.modal h2{font-size:19px;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.error-msg{background:#3a1010;border:1px solid #7a2020;color:#ff9999;padding:10px 12px;
  border-radius:8px;font-size:13px;margin-bottom:12px}
.switch-line{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.switch-line a{color:#6cb6ff;cursor:pointer}

.code-display{background:var(--bg3);border:2px dashed var(--accent);border-radius:12px;
  padding:16px;text-align:center;margin:16px 0}
.code-display .lbl{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.code-display .code{font-size:32px;font-weight:800;letter-spacing:8px;color:var(--accent);font-variant-numeric:tabular-nums}
.code-display .hint2{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}

/* =============== Студия =============== */
.studio{padding:14px 12px 30px;max-width:1100px;margin:0 auto}
.studio h1{font-size:20px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studio .beta{font-size:10px;background:var(--accent);color:#fff;padding:3px 7px;border-radius:6px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat-card .label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.stat-card .value{font-size:22px;font-weight:700;line-height:1.1}
.stat-card.accent{background:linear-gradient(135deg,rgba(255,0,51,.15),rgba(255,138,0,.15));border-color:rgba(255,0,51,.4)}

.danger-zone{background:#1a0d0d;border:1px solid #7a2020;border-radius:14px;padding:16px;margin-top:24px}
.danger-zone h3{color:#ff9999;font-size:15px;margin-bottom:8px}
.danger-zone p{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.4}
.danger-btn{background:#7a2020;color:#fff;border:none;padding:11px 20px;border-radius:20px;
  font-size:14px;font-weight:600}
.danger-btn:hover{background:#9a2828}

/* =============== Toast =============== */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:rgba(50,50,50,.97);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;
  z-index:2000;pointer-events:none;opacity:0;transition:opacity .2s;max-width:85%}
.toast.show{opacity:1}

/* =============== ПК ВЕРСИЯ =============== */
@media (min-width:900px){
  :root{--header-h:64px}
  body{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:auto 1fr;
    grid-template-areas:"sidebar header" "sidebar main"}

  header{grid-area:header;padding:10px 24px;gap:16px;position:sticky;top:0}
  .logo{font-size:19px}
  .logo .ver{font-size:11px}
  .search{display:flex}
  .top-search-btn{display:none}
  .bottom-nav{display:none}
  #authArea{margin-left:0}

  .sidebar{grid-area:sidebar;display:flex;flex-direction:column;gap:2px;
    background:var(--bg);border-right:1px solid var(--border);
    padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand-block{padding:10px 12px;margin-bottom:8px;font-size:15px;font-weight:800;
    display:flex;align-items:center;gap:8px}
  .sidebar .brand-block .dot{width:26px;height:18px;background:var(--accent);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .sidebar button{display:flex;align-items:center;gap:14px;background:none;border:none;
    color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;text-align:left;width:100%;
    transition:.15s;font-weight:500}
  .sidebar button:hover{background:var(--bg2)}
  .sidebar button.active{background:var(--bg3);font-weight:600}
  .sidebar button .ic{font-size:19px;width:24px;text-align:center}
  .sidebar .divider{height:1px;background:var(--border);margin:10px 4px}
  .sidebar .studio-label{font-size:11px;color:var(--muted);padding:10px 14px 6px;
    text-transform:uppercase;letter-spacing:.5px;font-weight:700}

  main{grid-area:main;padding-bottom:40px;overflow-x:hidden}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px 16px;padding:24px}
  .card{padding:0}
  .card:hover{transform:translateY(-2px)}
  .thumb{border-radius:var(--radius)}
  .card-info{padding:10px 0 0}
  .watch{max-width:1100px;margin:0 auto;padding:24px 24px 40px}
  .watch .player-wrap{border-radius:var(--radius)}
  .watch h1{font-size:22px;margin:16px 0 12px}
  .watch .action-row{padding:0 0 8px}
  .comments{padding:0}
  .page{max-width:760px;padding:32px 20px}
  .modal-bg{align-items:center;padding:20px}
  .modal{border-radius:16px;padding:26px;max-width:520px}
  .chan-header{padding:0 34px;margin-top:-48px;display:flex;gap:24px;align-items:flex-end}
  .chan-avatar{width:104px;height:104px;font-size:46px;border-width:4px}
  .chan-info{margin-top:0;padding-top:52px}
  .chan-info h1{font-size:26px}
  .tabs{padding:0 34px}
  .about-section{padding:26px 34px;max-width:900px;margin:0 auto}
  .community{max-width:680px;margin:0 auto;padding:26px 20px}
  .studio{padding:24px 24px 40px}
  .studio h1{font-size:26px}
  .stat-grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .stat-card .value{font-size:28px}
  /* Комментарии на ПК — шире */
  .comment .body{max-width:900px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand-block" onclick="location.hash='#/'">
    <div class="dot">▶</div> VidTube
  </div>
  <button data-side="/" onclick="location.hash='#/'"><span class="ic">🏠</span>Главная</button>
  <button data-side="/create" onclick="location.hash='#/create'"><span class="ic">＋</span>Создать</button>
  <button data-side="/channel" onclick="location.hash='#/channel/videos'"><span class="ic">📺</span>Мой канал</button>
  <div class="divider"></div>
  <div class="studio-label">Студия</div>
  <button data-side="/studio" onclick="location.hash='#/studio'"><span class="ic">📊</span>Творческая студия</button>
</aside>

<header>
  <div class="logo" onclick="location.hash='#/'">
    <div class="dot">▶</div>
    <span>VidTube</span>
    <span class="ver">0.0.7α</span>
  </div>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Поиск...">
    <button onclick="doSearch()">🔍</button>
  </div>
  <button class="top-search-btn" onclick="toggleMobileSearch()">🔍</button>
  <div id="authArea"></div>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button data-bnav="/" onclick="location.hash='#/'"><span class="ic">🏠</span>Главная</button>
  <button data-bnav="/studio" onclick="location.hash='#/studio'"><span class="ic">📊</span>Студия</button>
  <button data-bnav="/create" onclick="location.hash='#/create'"><span class="plus">＋</span></button>
  <button data-bnav="/channel" onclick="location.hash='#/channel/videos'"><span class="ic">📺</span>Канал</button>
  <button id="bnavAuth" onclick="handleBottomAuth()"><span class="ic" id="bnavAuthIcon">👤</span><span id="bnavAuthLabel">Войти</span></button>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   БРЕНД
   ========================================================= */
const BRAND = { name:'VidTube', version:'0.0.7α', domain:'vid-tube.ru' };

/* =========================================================
   IndexedDB
   ========================================================= */
let db = null;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('vidtube_db_v3', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('videos')) d.createObjectStore('videos', {keyPath:'id'});
      if (!d.objectStoreNames.contains('posts'))  d.createObjectStore('posts',  {keyPath:'id'});
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror   = e => rej(e.target.error);
  });
}
const st = (n,m)=>db.transaction(n,m).objectStore(n);
const dbPut    = (n,v)=>new Promise((res,rej)=>{const r=st(n,'readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const dbGet    = (n,id)=>new Promise((res,rej)=>{const r=st(n,'readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbGetAll = n=>new Promise((res,rej)=>{const r=st(n,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbDel    = (n,id)=>new Promise((res,rej)=>{const r=st(n,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const dbClear  = n=>new Promise((res,rej)=>{const r=st(n,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});

/* =========================================================
   Утилиты
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const on = (el,ev,fn,opt)=>el&&el.addEventListener(ev,fn,opt);

function fmtNum(n){
  n = n||0;
  if (n>=1e6) return (n/1e6).toFixed(1).replace('.0','')+' млн';
  if (n>=1e3) return (n/1e3).toFixed(1).replace('.0','')+' тыс.';
  return String(Math.round(n));
}
function fmtNumFull(n){ return (n||0).toLocaleString('ru-RU'); }
function timeAgo(ts){
  const d = Date.now()-ts, m = Math.floor(d/60000);
  if (m<1) return 'только что';
  if (m<60) return m+' мин. назад';
  const h = Math.floor(m/60); if (h<24) return h+' ч. назад';
  const dd = Math.floor(h/24);
  if (dd<30) return dd+' дн. назад';
  return new Date(ts).toLocaleDateString('ru-RU');
}
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}); }
function fmtTime(s){
  if (!isFinite(s)||s<0) s=0; s=Math.floor(s);
  const sec=s%60, m=Math.floor(s/60)%60, h=Math.floor(s/3600);
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');
}
function plural(n,o,f,m){
  const a=n%10, b=n%100;
  if (a===1&&b!==11) return o;
  if (a>=2&&a<=4&&(b<10||b>=20)) return f;
  return m;
}
function readAsDataURL(f){ return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);}); }
let objectUrls=[];
function makeUrl(b){ const u=URL.createObjectURL(b); objectUrls.push(u); return u; }
function clearUrls(){ objectUrls.forEach(u=>URL.revokeObjectURL(u)); objectUrls=[]; }

function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), ms);
}
window.toast = toast;

/* =========================================================
   Авторизация
   ========================================================= */
function getUsers(){ try{return JSON.parse(localStorage.getItem('vidtube_users')||'[]');}catch{return[];} }
function saveUsers(u){ localStorage.setItem('vidtube_users', JSON.stringify(u)); }
function getCurrentUser(){
  const em = localStorage.getItem('vidtube_current');
  return em ? getUsers().find(u=>u.email===em)||null : null;
}
function hashPass(p){ return btoa(unescape(encodeURIComponent(p+'::vidtube_v3_salt'))); }
function emailValid(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function genCode(){ return String(Math.floor(100000 + Math.random()*900000)); }

function startRegistration(email, password, name){
  email = email.trim().toLowerCase(); name = name.trim();
  if (!emailValid(email)) return {error:'Введите правильный email'};
  if (password.length < 6) return {error:'Пароль: минимум 6 символов'};
  if (name.length < 2) return {error:'Имя: минимум 2 символа'};
  const users = getUsers();
  if (users.some(u=>u.email === email)) return {error:'Этот email уже зарегистрирован'};
  const code = genCode();
  localStorage.setItem('vidtube_pending', JSON.stringify({
    email, password:hashPass(password), name, code, date:Date.now()
  }));
  return {ok:true, code, email};
}
function confirmRegistration(inputCode){
  const raw = localStorage.getItem('vidtube_pending');
  if (!raw) return {error:'Сессия истекла. Начните заново.'};
  const p = JSON.parse(raw);
  if (Date.now() - p.date > 30*60*1000) return {error:'Код устарел.'};
  if (String(inputCode).trim() !== p.code) return {error:'Неверный код'};
  const users = getUsers();
  if (users.some(u=>u.email === p.email)) return {error:'Email занят'};
  users.push({ email: p.email, pass: p.password, name: p.name, date: Date.now() });
  saveUsers(users);
  localStorage.removeItem('vidtube_pending');
  localStorage.setItem('vidtube_current', p.email);
  setChannelConfig({
    name: p.name,
    handle: '@' + (p.name.toLowerCase().replace(/[^a-zа-яё0-9]/g,'').slice(0,15) || 'user'),
    desc: 'Добро пожаловать на мой канал на VidTube!',
    avatar: { type:'emoji', value:'🎬' },
    banner: { type:'gradient', value:'linear-gradient(120deg,#ff0033,#ff8a00,#7a00ff)' },
    subscribers: 0,
    createdAt: Date.now()
  });
  return {ok:true};
}
function loginUser(email, password){
  email = email.trim().toLowerCase();
  const u = getUsers().find(x=>x.email === email);
  if (!u) return {error:'Пользователь не найден'};
  if (u.pass !== hashPass(password)) return {error:'Неверный пароль'};
  localStorage.setItem('vidtube_current', u.email);
  if (!localStorage.getItem('channelConfig')){
    const name = u.name || u.email.split('@')[0];
    setChannelConfig({
      name, handle: '@' + name.toLowerCase().replace(/[^a-zа-яё0-9]/g,'').slice(0,15),
      desc:'', avatar:{type:'emoji', value:'🎬'},
      banner:{type:'gradient', value:'linear-gradient(120deg,#ff0033,#ff8a00,#7a00ff)'},
      subscribers:0, createdAt:Date.now()
    });
  }
  return {ok:true};
}
function logout(){ localStorage.removeItem('vidtube_current'); renderAuthArea(); render(); }
window.logout = logout;
function handleBottomAuth(){
  const u = getCurrentUser();
  if (u) location.hash = '#/channel/videos';
  else openAuthModal('login');
}
window.handleBottomAuth = handleBottomAuth;

/* =========================================================
   Конфиг канала
   ========================================================= */
const DEFAULT_CHANNEL = {
  name:'', handle:'', desc:'',
  avatar:{type:'emoji', value:'🎬'},
  banner:{type:'gradient', value:'linear-gradient(120deg,#ff0033,#ff8a00,#7a00ff)'},
  subscribers: 0, createdAt: null
};
function getChannelConfig(){
  try {
    const raw = localStorage.getItem('channelConfig');
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_CHANNEL));
    const c = JSON.parse(raw);
    return { ...DEFAULT_CHANNEL, ...c,
      avatar:{...DEFAULT_CHANNEL.avatar, ...(c.avatar||{})},
      banner:{...DEFAULT_CHANNEL.banner, ...(c.banner||{})} };
  } catch { return JSON.parse(JSON.stringify(DEFAULT_CHANNEL)); }
}
function setChannelConfig(c){ localStorage.setItem('channelConfig', JSON.stringify(c)); }
function avatarHTML(){
  const c = getChannelConfig();
  if (c.avatar.type==='image' && c.avatar.value) return `<img src="${c.avatar.value}" alt="">`;
  return esc(c.avatar.value||'🎬');
}
function bannerStyle(){
  const c = getChannelConfig();
  if (c.banner.type==='image' && c.banner.value) return `background-image:url('${c.banner.value}')`;
  return `background:${c.banner.value||DEFAULT_CHANNEL.banner.value}`;
}

/* =========================================================
   Модалки
   ========================================================= */
function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg = $('.modal-bg', root);
  on(bg, 'mousedown', e => { if (e.target===bg) closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
window.closeModal = closeModal;

/* =========================================================
   Auth UI
   ========================================================= */
function renderAuthArea(){
  const area = document.getElementById('authArea');
  const u = getCurrentUser();
  if (u){
    const initial = (u.name || u.email)[0].toUpperCase();
    area.innerHTML = `<div class="user-chip" onclick="location.hash='#/channel/videos'">
      <div class="mini-avatar">${esc(initial)}</div>
      <span>${esc(u.name || u.email)}</span></div>`;
    const ico = document.getElementById('bnavAuthIcon');
    const lbl = document.getElementById('bnavAuthLabel');
    if (ico) ico.textContent = initial;
    if (lbl) lbl.textContent = 'Профиль';
  } else {
    area.innerHTML = `
      <button class="auth-btn" onclick="openAuthModal('login')">Войти</button>
      <button class="auth-btn primary" onclick="openAuthModal('register')">Регистрация</button>`;
    const ico = document.getElementById('bnavAuthIcon');
    const lbl = document.getElementById('bnavAuthLabel');
    if (ico) ico.textContent = '👤';
    if (lbl) lbl.textContent = 'Войти';
  }
}
window.renderAuthArea = renderAuthArea;

function openAuthModal(mode='register'){ return mode==='login' ? openLoginModal() : openRegisterModal(); }
window.openAuthModal = openAuthModal;

function openRegisterModal(){
  openModal(`
    <h2>Регистрация на ${BRAND.name}</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.4">
      Укажите email — мы отправим код подтверждения. Пока это демо, код появится на экране.
    </p>
    <div id="regErr"></div>
    <div class="field"><label>Имя канала *</label><input type="text" id="rName" maxlength="30" placeholder="Например: Kolya Games" autocomplete="name"></div>
    <div class="field"><label>Email *</label><input type="email" id="rEmail" maxlength="80" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Пароль *</label><input type="password" id="rPass" maxlength="60" placeholder="Минимум 6 символов" autocomplete="new-password"></div>
    <div class="modal-actions">
      <button class="auth-btn" onclick="closeModal()">Отмена</button>
      <button class="submit" id="rSubmit">Получить код</button>
    </div>
    <div class="switch-line">Уже есть аккаунт? <a onclick="openLoginModal()">Войти</a></div>
  `);
  setTimeout(()=>$('#rName')?.focus(), 50);
  const go = () => {
    const r = startRegistration($('#rEmail').value, $('#rPass').value, $('#rName').value);
    if (r.error){ $('#regErr').innerHTML = `<div class="error-msg">${esc(r.error)}</div>`; return; }
    openCodeConfirmModal(r.code, r.email);
  };
  $('#rSubmit').onclick = go;
  $('#rPass').onkeydown = e => { if (e.key==='Enter') go(); };
}
window.openRegisterModal = openRegisterModal;

function openCodeConfirmModal(code, email){
  openModal(`
    <h2>Подтвердите email</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.4">
      Мы отправили код на <b style="color:var(--text)">${esc(email)}</b>
    </p>
    <div class="code-display">
      <div class="lbl">КОД (ДЕМО)</div>
      <div class="code">${esc(code)}</div>
      <div class="hint2">На реальном сервере код ушёл бы на почту</div>
    </div>
    <div id="codeErr"></div>
    <div class="field"><label>Введите код</label>
      <input type="text" id="cCode" maxlength="6" inputmode="numeric" placeholder="000000"
        style="text-align:center;font-size:20px;letter-spacing:6px;font-weight:700">
    </div>
    <div class="modal-actions">
      <button class="auth-btn" onclick="closeModal()">Отмена</button>
      <button class="submit" id="cSubmit">Подтвердить</button>
    </div>
    <div class="switch-line"><a onclick="openRegisterModal()">← Изменить данные</a></div>
  `);
  setTimeout(()=>$('#cCode')?.focus(), 50);
  const go = () => {
    const r = confirmRegistration($('#cCode').value);
    if (r.error){ $('#codeErr').innerHTML = `<div class="error-msg">${esc(r.error)}</div>`; return; }
    closeModal(); renderAuthArea(); render();
    toast('Добро пожаловать на ' + BRAND.name + '!');
  };
  $('#cSubmit').onclick = go;
  $('#cCode').onkeydown = e => { if (e.key==='Enter') go(); };
}
window.openCodeConfirmModal = openCodeConfirmModal;

function openLoginModal(){
  openModal(`
    <h2>Вход в ${BRAND.name}</h2>
    <div id="loginErr"></div>
    <div class="field"><label>Email</label><input type="email" id="lEmail" maxlength="80" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Пароль</label><input type="password" id="lPass" maxlength="60" autocomplete="current-password"></div>
    <div class="modal-actions">
      <button class="auth-btn" onclick="closeModal()">Отмена</button>
      <button class="submit" id="lSubmit">Войти</button>
    </div>
    <div class="switch-line">Нет аккаунта? <a onclick="openRegisterModal()">Создать</a></div>
  `);
  setTimeout(()=>$('#lEmail')?.focus(), 50);
  const go = () => {
    const r = loginUser($('#lEmail').value, $('#lPass').value);
    if (r.error){ $('#loginErr').innerHTML = `<div class="error-msg">${esc(r.error)}</div>`; return; }
    closeModal(); renderAuthArea(); render();
    toast('С возвращением!');
  };
  $('#lSubmit').onclick = go;
  $('#lPass').onkeydown = e => { if (e.key==='Enter') go(); };
}
window.openLoginModal = openLoginModal;

/* =========================================================
   Мобильный поиск
   ========================================================= */
let searchQuery = '';
function toggleMobileSearch(){
  const existing = $('.mobile-search-bar');
  if (existing){ existing.remove(); return; }
  const bar = document.createElement('div');
  bar.style.cssText = 'padding:8px 12px;display:flex;gap:8px;background:var(--bg);border-bottom:1px solid var(--border)';
  bar.className = 'mobile-search-bar';
  bar.innerHTML = `<input type="text" id="mSearch" placeholder="Поиск..." value="${esc(searchQuery)}" style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);outline:none">
    <button id="mSearchBtn" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);width:42px;border-radius:50%;font-size:16px">🔍</button>`;
  document.querySelector('header').insertAdjacentElement('afterend', bar);
  const inp = $('#mSearch'); inp.focus();
  const submit = () => { searchQuery = inp.value; bar.remove(); if (location.hash!=='#/') location.hash='#/'; else render(); };
  inp.onkeydown = e => { if (e.key==='Enter') submit(); };
  $('#mSearchBtn').onclick = submit;
}
window.toggleMobileSearch = toggleMobileSearch;

/* =========================================================
   Роутер
   ========================================================= */
const app = document.getElementById('app');
let playerCleanup = null;

async function render(){
  clearUrls();
  if (playerCleanup){ try{playerCleanup();}catch{} playerCleanup = null; }
  $('.mobile-search-bar')?.remove();
  window.scrollTo(0,0);

  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);

  // Активная кнопка в шапке и сайдбаре
  const navKey = parts[0] ? '/'+parts[0] : '/';
  $$('nav button[data-nav]').forEach(b=>b.classList.remove('active'));
  const nb = $(`nav button[data-nav="${navKey}"]`);
  if (nb) nb.classList.add('active');

  $$('.sidebar button[data-side]').forEach(b=>b.classList.remove('active'));
  const sb = $(`.sidebar button[data-side="${navKey}"]`);
  if (sb) sb.classList.add('active');

  let bkey = '/';
  if (parts[0]==='create') bkey='/create';
  else if (parts[0]==='studio') bkey='/studio';
  else if (parts[0]==='channel') bkey='/channel';
  else if (parts[0]==='watch') bkey='';
  $$('.bottom-nav button[data-bnav]').forEach(b=>b.classList.toggle('active', b.dataset.bnav===bkey));

  renderAuthArea();
  document.title = BRAND.name + (parts[0]==='watch' ? '' : ' — ' + BRAND.version);

  const user = getCurrentUser();
  if (!user && parts[0] !== 'watch' && parts[0] !== ''){
    renderAuthGate(parts[0]);
    return;
  }

  try {
    if (parts[0]==='watch' && parts[1])      await renderWatch(parts[1]);
    else if (parts[0]==='create')            renderCreate();
    else if (parts[0]==='studio')            await renderStudio();
    else if (parts[0]==='channel')           await renderChannel(parts[1] || 'videos');
    else                                     await renderHome();
  } catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`;
  }
}

function renderAuthGate(where){
  const titles = { create:'Создание видео', studio:'Творческая студия', channel:'Мой канал' };
  app.innerHTML = `
    <div class="empty" style="padding:80px 20px">
      <h2>${esc(titles[where] || 'Эта страница')}</h2>
      <p>Чтобы пользоваться разделом, войдите или создайте аккаунт.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="submit" onclick="openRegisterModal()">Создать аккаунт</button>
        <button class="auth-btn" style="padding:12px 22px;font-size:14px" onclick="openLoginModal()">Войти</button>
      </div>
    </div>`;
}

/* =========================================================
   Главная
   ========================================================= */
async function renderHome(){
  const user = getCurrentUser();
  if (!user){
    app.innerHTML = `
      <div style="padding:60px 24px 40px;text-align:center;max-width:520px;margin:0 auto">
        <div style="width:70px;height:50px;background:var(--accent);border-radius:12px;
          display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:20px">▶</div>
        <h1 style="font-size:26px;margin-bottom:12px;line-height:1.2">Добро пожаловать на ${BRAND.name}</h1>
        <p style="color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:26px">
          Загружайте видео, собирайте лайки, ведите канал.<br>Всё бесплатно и без ограничений.
        </p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="submit" style="padding:14px 30px;font-size:15px" onclick="openRegisterModal()">Создать аккаунт</button>
          <button class="auth-btn" style="padding:14px 22px;font-size:14px" onclick="openLoginModal()">Войти</button>
        </div>
        <p style="color:var(--muted);font-size:12px;margin-top:24px;line-height:1.5">
          Регистрация через email · Демо-версия ${BRAND.version}
        </p>
      </div>`;
    return;
  }

  let videos = await dbGetAll('videos');
  videos.sort((a,b)=>b.date-a.date);
  if (searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    videos = videos.filter(v => v.title.toLowerCase().includes(q) || (v.desc||'').toLowerCase().includes(q));
  }
  if (!videos.length){
    app.innerHTML = `
      <div class="empty">
        <h2>${searchQuery ? 'Ничего не найдено' : 'Здесь пока пусто'}</h2>
        <p>${searchQuery ? 'Попробуйте другой запрос' : 'Загрузите своё первое видео'}</p>
        <button class="submit" onclick="location.hash='#/create'">＋ Создать видео</button>
      </div>`;
    return;
  }
  const chan = getChannelConfig();
  app.innerHTML = `<div class="grid">` + videos.map(v => {
    const thumb = v.thumb
      ? `<img src="${v.thumb}" alt="">`
      : (v.ytId ? `<img src="https://i.ytimg.com/vi/${v.ytId}/hqdefault.jpg" alt="">` : `<div class="play">▶</div>`);
    const dur = v.duration ? `<span class="duration-badge">${fmtTime(v.duration)}</span>` : '';
    return `
      <div class="card" onclick="location.hash='#/watch/${v.id}'">
        <div class="thumb">${thumb}${dur}</div>
        <div class="card-info">
          <div class="card-avatar">${avatarHTML()}</div>
          <div class="card-body">
            <div class="card-title">${esc(v.title)}</div>
            <div class="card-meta">${esc(chan.name)} · ${fmtNum(v.views)} просмотров · ${timeAgo(v.date)}</div>
          </div>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

function doSearch(){
  searchQuery = document.getElementById('searchInput').value;
  if (location.hash !== '#/' && location.hash !== '') location.hash = '#/';
  else render();
}
window.doSearch = doSearch;
on(document.getElementById('searchInput'), 'keydown', e => { if (e.key==='Enter') doSearch(); });

/* =========================================================
   Просмотр + комментарии
   ========================================================= */
async function renderWatch(id){
  const v = await dbGet('videos', id);
  if (!v){

/* --------- Рендер дерева комментариев --------- */
function renderCommentTree(c, allComments, video, currentUser){
  const replies = allComments.filter(x => x.parentId === c.id);
  const isReply = !!c.parentId;
  const chan = getChannelConfig();
  const isChannelOwner = currentUser && (currentUser.name === chan.name) || (currentUser && currentUser.email.startsWith('owner_'));
  const isCommentAuthor = currentUser && c.authorId === currentUser.email;
  const canPin = isChannelOwner || isCommentAuthor;
  const canHeart = isChannelOwner;
  const canDelete = isChannelOwner || isCommentAuthor;

  return `
    <div class="comment ${c.pinned?'pinned':''}" data-comment="${c.id}">
      <div class="avatar">${esc((c.author||'Г')[0].toUpperCase())}</div>
      <div class="body">
        ${c.pinned ? '<div class="pin-label">📌 Закреплено автором</div>' : ''}
        <div class="head">
          <b>${esc(c.author)}</b>
          ${isChannelOwner ? '<span class="author-badge">АВТОР</span>' : ''}
          <span>${timeAgo(c.date)}</span>
          ${c.hearted ? '<span class="heart">❤</span>' : ''}
        </div>
        <p>${esc(c.text)}</p>
        <div class="comment-actions">
          <button data-act="clike" data-id="${c.id}" class="${(c.likedBy||[]).includes(currentUser?.email)?'liked':''}">
            👍 ${fmtNum(c.likes||0)}
          </button>
          <button data-act="cdislike" data-id="${c.id}" class="${(c.dislikedBy||[]).includes(currentUser?.email)?'disliked':''}">
            👎 ${fmtNum(c.dislikes||0)}
          </button>
          ${currentUser ? `<button data-act="reply" data-id="${c.id}">Ответить</button>` : ''}
          ${(canPin || canHeart || canDelete) ? `<button class="menu-btn" data-act="menu" data-id="${c.id}">⋮</button>` : ''}
        </div>
        <div id="replyBox-${c.id}"></div>
        ${replies.length ? `<div class="replies">${replies.map(r => renderCommentTree(r, allComments, video, currentUser)).join('')}</div>` : ''}
      </div>
    </div>`;
}

/* --------- Обработчики --------- */
function attachCommentHandlers(v, u, videoId){
  // Все кнопки комментариев
  $$('#commentList [data-act]').forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      const cid = btn.dataset.id;
      if (act === 'menu') return openCommentMenu(btn, cid, videoId, u);
      if (act === 'reply') return openReplyBox(cid, videoId, u);
      if (act === 'clike' || act === 'cdislike') return toggleCommentVote(videoId, cid, act === 'clike' ? 'like' : 'dislike', u);
    };
  });
}

async function toggleCommentVote(videoId, commentId, type, u){
  if (!u){ openLoginModal(); return; }
  const fresh = await dbGet('videos', videoId);
  const c = (fresh.comments||[]).find(x => x.id === commentId);
  if (!c) return;
  c.likedBy = c.likedBy || [];
  c.dislikedBy = c.dislikedBy || [];
  const inLiked = c.likedBy.includes(u.email);
  const inDisliked = c.dislikedBy.includes(u.email);

  if (type === 'like'){
    if (inLiked){ c.likedBy = c.likedBy.filter(e => e !== u.email); }
    else { c.likedBy.push(u.email); c.dislikedBy = c.dislikedBy.filter(e => e !== u.email); }
  } else {
    if (inDisliked){ c.dislikedBy = c.dislikedBy.filter(e => e !== u.email); }
    else { c.dislikedBy.push(u.email); c.likedBy = c.likedBy.filter(e => e !== u.email); }
  }
  c.likes = c.likedBy.length;
  c.dislikes = c.dislikedBy.length;
  await dbPut('videos', fresh);
  render();
}

function openReplyBox(commentId, videoId, u){
  if (!u){ openLoginModal(); return; }
  const box = document.getElementById('replyBox-' + commentId);
  if (!box) return;
  if (box.innerHTML){ box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="reply-box">
      <div class="card-avatar" style="width:28px;height:28px;font-size:12px">${esc((u.name||u.email)[0].toUpperCase())}</div>
      <div style="flex:1">
        <input type="text" id="reply-${commentId}" placeholder="Ответить..." maxlength="500">
        <div class="reply-actions">
          <button data-cancel="${commentId}">Отмена</button>
          <button class="send" data-send="${commentId}">Ответить</button>
        </div>
      </div>
    </div>`;
  const inp = document.getElementById('reply-' + commentId);
  inp.focus();
  $('[data-cancel]', box).onclick = () => { box.innerHTML = ''; };
  const send = async () => {
    const text = inp.value.trim();
    if (!text) return;
    const fresh = await dbGet('videos', videoId);
    fresh.comments = fresh.comments || [];
    fresh.comments.push({
      id:'c'+Date.now(),
      author: u.name || u.email,
      authorId: u.email,
      text, date:Date.now(),
      likes:0, dislikes:0, hearted:false, pinned:false,
      likedBy:[], dislikedBy:[], parentId: commentId
    });
    await dbPut('videos', fresh);
    render();
  };
  $('[data-send]', box).onclick = send;
  inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); send(); } };
}

function openCommentMenu(btn, commentId, videoId, u){
  // Закрываем прошлое меню, если было
  document.querySelectorAll('.comment-menu').forEach(m => m.remove());
  const rect = btn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'comment-menu';
  menu.style.cssText = `position:fixed;top:${rect.bottom + 4}px;right:10px;`;

  const chan = getChannelConfig();
  const isChannelOwner = u && (u.name === chan.name);
  const isCommentAuthor = u && u.email && (commentId && (async () => true)());
  // Получим коммент для проверки
  (async () => {
    const fresh = await dbGet('videos', videoId);
    const c = (fresh.comments||[]).find(x => x.id === commentId);
    if (!c) return;
    const isAuthor = u && c.authorId === u.email;
    const canPin = isChannelOwner || isAuthor;
    const canHeart = isChannelOwner;
    const canDelete = isChannelOwner || isAuthor;

    let html = '';
    if (canPin) html += `<button data-mact="pin" data-id="${commentId}">${c.pinned ? '📌 Открепить' : '📌 Закрепить'}</button>`;
    if (canHeart) html += `<button data-mact="heart" data-id="${commentId}">${c.hearted ? '❤ Убрать сердечко' : '❤ Поставить сердечко'}</button>`;
    if (canDelete) html += `<button data-mact="delete" data-id="${commentId}" style="color:#ff8888">🗑 Удалить</button>`;
    if (!html) html = '<button disabled style="color:#888">Нет действий</button>';
    menu.innerHTML = html;

    menu.querySelectorAll('[data-mact]').forEach(b => b.onclick = async () => {
      const act = b.dataset.mact;
      menu.remove();
      if (act === 'delete'){
        if (!confirm('Удалить комментарий?')) return;
        const fr = await dbGet('videos', videoId);
        fr.comments = (fr.comments||[]).filter(x => x.id !== commentId && x.parentId !== commentId);
        await dbPut('videos', fr);
        render();
      } else if (act === 'pin'){
        const fr = await dbGet('videos', videoId);
        const cm = (fr.comments||[]).find(x => x.id === commentId);
        if (cm){ cm.pinned = !cm.pinned; await dbPut('videos', fr); render(); }
      } else if (act === 'heart'){
        const fr = await dbGet('videos', videoId);
        const cm = (fr.comments||[]).find(x => x.id === commentId);
        if (cm){ cm.hearted = !cm.hearted; await dbPut('videos', fr); render(); }
      }
    });

    document.body.appendChild(menu);
    // Закрыть по клику вне
    const close = e => {
      if (!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', close); }
    };
    setTimeout(() => document.addEventListener('click', close), 50);
  })();
}

/* =========================================================
   Мини-плеер
   ========================================================= */
function setupPlayer(video, wrap){
  const played = $('#played', wrap);
  const buffered = $('#buffered', wrap);
  const tCur = $('#tCur', wrap);
  const tDur = $('#tDur', wrap);
  const progress = $('#progress', wrap);
  const btn = act => wrap.querySelector(`[data-act="${act}"]`);

  video.addEventListener('loadedmetadata', () => { tDur.textContent = fmtTime(video.duration); });
  video.addEventListener('play', () => { $('#playBtn').textContent = '⏸'; showCtrl(); });
  video.addEventListener('pause', () => { $('#playBtn').textContent = '▶'; showCtrl(true); });
  video.addEventListener('timeupdate', () => {
    const d = video.duration || 0;
    played.style.width = d ? (video.currentTime / d * 100) + '%' : '0';
    tCur.textContent = fmtTime(video.currentTime);
    if (video.buffered.length){
      const b = d ? (video.buffered.end(video.buffered.length-1) / d * 100) : 0;
      buffered.style.width = b + '%';
    }
  });

  const seek = e => {
    const r = progress.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    if (isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(1, x / r.width)) * video.duration;
  };
  let dragging = false;
  on(progress, 'mousedown', e => { dragging = true; seek(e); e.preventDefault(); });
  on(progress, 'touchstart', e => { dragging = true; seek(e); }, {passive:true});
  on(window, 'mousemove', e => { if (dragging) seek(e); });
  on(window, 'touchmove', e => { if (dragging) seek(e); }, {passive:true});
  on(window, 'mouseup', () => dragging = false);
  on(window, 'touchend', () => dragging = false);

  on(btn('play'), 'click', () => video.paused ? video.play() : video.pause());
  on(btn('back10'), 'click', () => video.currentTime = Math.max(0, video.currentTime - 10));
  on(btn('fwd10'), 'click', () => video.currentTime = Math.min(video.duration||0, video.currentTime + 10));
  on(btn('pip'), 'click', async () => {
    try { if (document.pictureInPictureElement) await document.exitPictureInPicture();
          else await video.requestPictureInPicture(); } catch {}
  });
  on(btn('fullscreen'), 'click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (wrap.requestFullscreen || wrap.webkitRequestFullscreen || wrap.webkitEnterFullscreen).call(wrap);
  });

  let hideTimer;
  function showCtrl(stay=false){
    wrap.classList.add('show-controls');
    clearTimeout(hideTimer);
    if (!stay && !video.paused) hideTimer = setTimeout(() => wrap.classList.remove('show-controls'), 2500);
  }
  on(wrap, 'mousemove', () => showCtrl());
  on(wrap, 'touchstart', () => showCtrl());
  on(video, 'click', () => video.paused ? video.play() : video.pause());
  on(video, 'dblclick', () => btn('fullscreen').click());
  showCtrl(true);

  playerCleanup = () => {};
}

            <div><b style="font-size:14px">${esc(cfg.name)}</b><div style="font-size:12px;color:var(--muted)">${timeAgo(p.date)}</div></div>
          </div>
          <div style="font-size:14px;line-height:1.5;white-space:pre-wrap">${esc(p.text)}</div>
          ${p.image ? `<img src="${p.image}" style="width:100%;border-radius:10px;margin-top:10px">` : ''}
          <div style="display:flex;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">
            <button class="edit-btn" data-plike="${p.id}" style="background:none;padding:4px 6px;font-size:13px">👍 ${fmtNum(p.likes)}</button>
            <button class="edit-btn" data-pdel="${p.id}" style="background:none;padding:4px 6px;font-size:13px">🗑</button>
          </div>
        </div>
      `).join('') : '<p style="color:#777;text-align:center;padding:30px;font-size:14px">Постов пока нет</p>'}
    </div>`;
  } else if (tab === 'about'){
    const watchHours = (totalWatchSec/3600).toFixed(1);
    content = `<div class="about-section">
      <h2 style="font-size:16px;margin-bottom:14px">Описание канала</h2>
      <div class="about-grid">
        <div class="about-card"><div class="label">👁 Просмотры</div><div class="value">${fmtNumFull(totalViews)}</div><div class="sub">За всё время</div></div>
        <div class="about-card"><div class="label">📅 Дата регистрации</div><div class="value" style="font-size:16px">${cfg.createdAt?fmtDate(cfg.createdAt):'—'}</div><div class="sub">${cfg.createdAt?timeAgo(cfg.createdAt):''}</div></div>
        <div class="about-card"><div class="label">⏱ Часов просмотра</div><div class="value">${watchHours}</div><div class="sub">Всего</div></div>
        <div class="about-card"><div class="label">👍 Лайков</div><div class="value">${fmtNumFull(totalLikes)}</div><div class="sub">На видео</div></div>
      </div>
      <div class="about-grid">
        <div class="about-card desc-card"><div class="label">📝 О канале</div><div class="value">${cfg.desc ? esc(cfg.desc) : 'Описание не указано'}</div></div>
      </div>
      <div class="about-grid">
        <div class="about-card"><div class="label">🔗 Ссылка</div><div class="value" style="font-size:14px">${esc(cfg.handle||'—')}</div></div>
        <div class="about-card"><div class="label">📊 Контент</div><div class="value" style="font-size:14px">${videos.length} ${plural(videos.length,'видео','видео','видео')} · ${posts.length} ${plural(posts.length,'пост','поста','постов')}</div></div>
      </div>
    </div>`;
  } else {
    content = videos.length ? `<div class="grid">` + videos.map(v => {
      const thumb = v.thumb ? `<img src="${v.thumb}">`
        : (v.ytId ? `<img src="https://i.ytimg.com/vi/${v.ytId}/hqdefault.jpg">` : `<div class="play">▶</div>`);
      const dur = v.duration ? `<span class="duration-badge">${fmtTime(v.duration)}</span>` : '';
      return `<div class="card" onclick="location.hash='#/watch/${v.id}'">
        <div class="thumb">${thumb}${dur}</div>
        <div class="card-info"><div class="card-avatar">${avatarHTML()}</div>
          <div class="card-body"><div class="card-title">${esc(v.title)}</div>
          <div class="card-meta">${fmtNum(v.views)} просмотров · ${timeAgo(v.date)}</div></div>
        </div></div>`;
    }).join('') + `</div>`
    : `<div class="empty"><h2>На канале нет видео</h2>
        <p>Загрузите первое видео</p>
        <button class="submit" onclick="location.hash='#/create'">＋ Создать видео</button></div>`;
  }

  app.innerHTML = `
    <div class="banner" style="${bannerStyle()}"></div>
    <div class="chan-header">
      <div class="chan-avatar">${avatarHTML()}</div>
      <div class="chan-info">
        <h1>${esc(cfg.name)}</h1>
        <div class="stats">${esc(cfg.handle)} · ${fmtNum(subs)} ${plural(subs,'подписчик','подписчика','подписчиков')} · ${videos.length} ${plural(videos.length,'видео','видео','видео')}</div>
        <div class="chan-actions">
          <button class="edit-btn" id="editChan">✏ Настроить канал</button>
          <button class="edit-btn" onclick="location.hash='#/studio'">📊 Студия</button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${tab!=='community'&&tab!=='about'?'active':''}" onclick="location.hash='#/channel/videos'">Видео</button>
      <button class="tab ${tab==='community'?'active':''}" onclick="location.hash='#/channel/community'">Сообщество</button>
      <button class="tab ${tab==='about'?'active':''}" onclick="location.hash='#/channel/about'">Описание</button>
    </div>
    ${content}
  `;

  $('#editChan').onclick = openChannelEdit;

  if (tab === 'community'){
    $('#postBtn').onclick = async () => {
      const text = $('#postText').value.trim();
      if (!text){ alert('Введите текст'); return; }
      const imgFile = $('#postImg').files[0];
      const image = imgFile ? await readAsDataURL(imgFile) : null;
      await dbPut('posts', {id:'p'+Date.now(), text, image, likes:0, liked:false, date:Date.now()});
      render();
    };
    $$('[data-plike]').forEach(b => b.onclick = async () => {
      const p = await dbGet('posts', b.dataset.plike);
      if (!p) return;
      p.liked = !p.liked;
      p.likes = (p.likes||0) + (p.liked ? 1 : -1);
      await dbPut('posts', p);
      render();
    });
    $$('[data-pdel]').forEach(b => b.onclick = async () => {
      if (!confirm('Удалить?')) return;
      await dbDel('posts', b.dataset.pdel);
      render();
    });
  }
}

/* =========================================================
   Студия
   ========================================================= */
async function renderStudio(){
  const videos = await dbGetAll('videos');
  const cfg = getChannelConfig();
  videos.sort((a,b)=>b.date-a.date);
  const totalViews = videos.reduce((s,v)=>s+(v.views||0), 0);
  const totalLikes = videos.reduce((s,v)=>s+(v.likes||0), 0);
  const totalWatchSec = videos.reduce((s,v)=>s+(v.watchSeconds||0), 0);
  const watchHours = (totalWatchSec/3600).toFixed(1);
  const subs = cfg.subscribers || 0;

  app.innerHTML = `
    <div class="studio">
      <h1>${BRAND.name} Studio <span class="beta">ALPHA</span></h1>
      <p style="color:var(--muted);font-size:12px;margin-bottom:18px">${BRAND.version} · демо-версия</p>

      <div class="stat-grid">
        <div class="stat-card accent"><div class="label">Просмотры</div><div class="value">${fmtNum(totalViews)}</div></div>
        <div class="stat-card"><div class="label">Подписчики</div><div class="value">${fmtNum(subs)}</div></div>
        <div class="stat-card"><div class="label">Часов просмотра</div><div class="value">${watchHours}</div></div>
        <div class="stat-card"><div class="label">Лайки</div><div class="value">${fmtNum(totalLikes)}</div></div>
      </div>

      <h2 style="font-size:16px;margin:20px 0 12px">Мои видео</h2>
      ${videos.length ? videos.map(v => `
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:12px;align-items:center">
          <div style="width:80px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;background:#000">
            ${v.thumb ? `<img src="${v.thumb}" style="width:100%;height:100%;object-fit:cover">` : (v.ytId ? `<img src="https://i.ytimg.com/vi/${v.ytId}/hqdefault.jpg" style="width:100%;height:100%;object-fit:cover">` : '')}
          </div>
          <div style="flex:1;min-width:0">
            <b style="display:block;font-size:13px;line-height:1.3;margin-bottom:4px">${esc(v.title)}</b>
            <div style="font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap">
              <span>👁 ${fmtNum(v.views)}</span><span>👍 ${fmtNum(v.likes)}</span><span>💬 ${(v.comments||[]).length}</span>
            </div>
          </div>
          <button class="edit-btn" data-del="${v.id}" style="padding:6px 10px;font-size:12px">🗑</button>
        </div>
      `).join('') : '<p style="color:#777;font-size:14px">Нет видео</p>'}

      <div class="danger-zone">
        <h3>⚠ Опасная зона</h3>
        <p>Удаление канала необратимо. Все видео, посты, комментарии и статистика будут стёрты.</p>
        <button class="danger-btn" id="delChannelBtn">🗑 Удалить канал</button>
      </div>
    </div>
  `;

  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Удалить видео?')) return;
    await dbDel('videos', b.dataset.del);
    render();
  });

  $('#delChannelBtn').onclick = async () => {
    if (!confirm('Удалить КАНАЛ? Это сотрёт ВСЁ: видео, посты, комментарии, настройки канала.')) return;
    if (!confirm('Точно? Действие необратимо. Нажмите ОК, чтобы удалить окончательно.')) return;

    await dbClear('videos');
    await dbClear('posts');
    localStorage.removeItem('channelConfig');
    localStorage.removeItem('users');
    localStorage.removeItem('vidtube_current');
    localStorage.removeItem('vidtube_pending');
    localStorage.removeItem('subscribed');
    toast('Канал удалён. Возврат на главную...');
    setTimeout(() => { location.hash = '#/'; location.reload(); }, 1200);
  };
}

/* =========================================================
   Настройка канала
   ========================================================= */
function openChannelEdit(){
  const cfg = getChannelConfig();
  openModal(`
    <h2>Настройка канала</h2>
    <div class="field"><label>Имя</label><input type="text" id="mName" value="${esc(cfg.name)}" maxlength="30"></div>
    <div class="field"><label>Ник</label><input type="text" id="mHandle" value="${esc(cfg.handle)}" maxlength="30"></div>
    <div class="field"><label>Описание</label><textarea id="mDesc" maxlength="300">${esc(cfg.desc)}</textarea></div>
    <div class="field"><label>Аватар (эмодзи)</label><input type="text" id="mEmoji" value="${esc(cfg.avatar.value||'🎬')}" maxlength="4"></div>
    <div class="modal-actions">
      <button class="auth-btn" onclick="closeModal()">Отмена</button>
      <button class="submit" id="mSave">Сохранить</button>
    </div>
  `);
  $('#mSave').onclick = () => {
    const name = $('#mName').value.trim() || cfg.name;
    let handle = $('#mHandle').value.trim();
    if (!handle) handle = '@' + name.toLowerCase().replace(/\s+/g,'');
    if (!handle.startsWith('@')) handle = '@' + handle;
    setChannelConfig({ ...cfg, name, handle, desc: $('#mDesc').value.trim(), avatar:{type:'emoji', value:$('#mEmoji').value.trim()||'🎬'} });
    closeModal(); render();
  };
}

/* =========================================================
   Старт
   ========================================================= */
(async function init(){
  try {
    await openDB();
    if (!location.hash) location.hash = '#/';
    on(window, 'hashchange', render);
    await render();
  } catch(err){
    console.error(err);
    app.innerHTML = `<div class="empty"><h2>Ошибка</h2><p>${esc(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
